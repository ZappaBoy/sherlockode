services:
  sherlockode:
    build: .
    image: sherlockode:latest
    env_file:
      - path: .env
        required: false
    environment:
      # Sandbox containers are started by the host daemon, so bind mounts need host paths.
      REPO_AGENT_SANDBOX__HOST_WORKSPACE: ${PWD}/workspace
    volumes:
      - ./workspace:/workspace
      - ./sherlockode.toml:/config/sherlockode.toml:ro
      # Grants control of the host Docker daemon. Prefer rootless Docker or a dedicated sandbox host.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GID:-0}

  sandbox-image:
    profiles: ["build"]
    build:
      context: docker
      dockerfile: sandbox.Dockerfile
    image: sherlockode-sandbox:latest
