# Sherlockode configuration.
# Precedence: environment variables > .env > this file > defaults.
# Every key can be overridden with REPO_AGENT_<SECTION>__<KEY>, e.g. REPO_AGENT_SANDBOX__MEMORY=2g.
# Secrets never belong here: use REPO_AGENT_<PROVIDER>_TOKEN.

workspace = "workspace"
log_level = "INFO"

# --- Providers ---------------------------------------------------------------
# `kind` selects the implementation: git, github, gitlab (more can be registered).
# `integration` selects how provider APIs reach the agent: native tools, the official MCP server, or both.

[providers.github]
kind = "github"
namespaces = ["example"]          # organizations or users whose repositories are discovered
integration = "native"

[providers.gitlab]
kind = "gitlab"
base_url = "https://gitlab.example.com/api/v4"
namespaces = ["platform"]         # groups, including subgroups
include_archived = false
integration = "both"

[providers.gitlab.mcp]
transport = "http"
url = "https://gitlab.example.com/api/v4/mcp"
forward_token = true

# Official GitHub MCP server over stdio, as an alternative to the native tools:
# [providers.github]
# integration = "mcp"
# [providers.github.mcp]
# transport = "stdio"
# command = "docker"
# args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "-e", "GITHUB_READ_ONLY=1",
#         "ghcr.io/github/github-mcp-server"]
# token_env = "GITHUB_PERSONAL_ACCESS_TOKEN"

# --- Repositories ------------------------------------------------------------

[repositories]
include = [
    "git@gitlab.example.com:platform/service-a.git",
    "https://github.com/example/service-b.git",
    { url = "https://git.example.org/legacy/project-x.git", name = "project-x", tags = ["legacy"] },
]
exclude = ["*-archive", "sandbox-*"]

# --- Logical groups ----------------------------------------------------------
# A list is shorthand for explicit members; tables add selectors (patterns, tags, providers, namespaces).

[groups]
backend = ["service-a", "service-b"]

[groups.python]
description = "Python services"
repositories = ["service-a"]
tags = ["python"]

[groups.legacy]
tags = ["legacy"]

[groups.platform]
providers = ["gitlab"]
namespaces = ["platform*"]

# --- Agent -------------------------------------------------------------------

[agent]
model = "anthropic:claude-opus-5-5"
# planner_model = "anthropic:claude-sonnet-5"
default_scope = []                # groups or repositories; empty means everything
planning = true
# instructions = "Our services declare their Python version in .python-version."

# --- Execution limits --------------------------------------------------------

[limits]
max_repositories = 200
max_agent_requests = 60
max_tool_calls = 300
max_file_bytes = 200000
max_search_results = 200
max_log_entries = 2000
git_timeout_seconds = 600
# clone_depth = 1                 # faster clones, but history questions become unanswerable

# --- Sandbox -----------------------------------------------------------------

[sandbox]
enabled = true
backend = "docker"                # "local" runs unisolated subprocesses: development only
image = "sherlockode-sandbox:latest"
# runtime = "runsc"               # gVisor for kernel-level isolation
cpus = 1.0
memory = "1g"
pids_limit = 256
timeout_seconds = 120
network = "none"
user = "65534:65534"

# --- Storage -----------------------------------------------------------------

[storage]
# keep_investigations = 100
save_config_snapshot = true
