[project]
name = "sherlockode"
version = "0.1.0"
description = "Agentic intelligence platform for investigating software repositories across Git providers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pydantic-ai-slim[anthropic,openai,mcp]>=1.0",
    "httpx>=0.28",
    "typer>=0.16",
    "rich>=14.0",
    "jinja2>=3.1.6",
]

[project.scripts]
sherlockode = "sherlockode.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sherlockode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PTH", "ASYNC"]
ignore = ["PLR2004", "ASYNC240"]

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0917", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
disable_error_code = ["type-abstract"]
